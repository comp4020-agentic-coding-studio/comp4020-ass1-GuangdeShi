<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In life, only time costs</title>
    <meta
      name="description"
      content="Enter how you are paid to find your true hourly time value, then see fifty everyday and extraordinary things priced only in time."
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#calculator">Skip to the calculator</a>

    <nav class="page-nav" aria-label="On this page">
      <ul>
        <li><a href="#calculator">Calculator</a></li>
        <li><a href="#products">Products</a></li>
      </ul>
    </nav>

    <main id="main">
      <header class="hero">
        <h1 class="hero__title">In life,<br />only time<br />costs.</h1>
      </header>

      <section class="section" id="calculator" aria-labelledby="calculator-title">
        <h2 class="section__title" id="calculator-title">First, what’s your price?</h2>

        <form class="income" id="income-form" novalidate>
          <fieldset class="income__fields">
            <legend class="income__legend">How are you paid?</legend>

            <p class="field">
              <label class="field__label" for="pay-period">Pay period</label>
              <select class="field__control" id="pay-period" name="pay-period">
                <option value="hourly">By the hour</option>
                <option value="weekly">Weekly</option>
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </p>

            <p class="field">
              <label class="field__label" for="pay-amount" id="pay-amount-label">Monthly pay</label>
              <input
                class="field__control"
                id="pay-amount"
                name="pay-amount"
                type="number"
                inputmode="decimal"
                min="0"
                step="any"
                value="4400"
              />
            </p>

            <p class="field">
              <label class="field__label" for="work-hours">Hours you work, per week</label>
              <input
                class="field__control"
                id="work-hours"
                name="work-hours"
                type="number"
                inputmode="decimal"
                min="0"
                max="168"
                step="any"
                value="40"
              />
            </p>

            <p class="field">
              <label class="field__label" for="commute-hours">Hours you commute, per week</label>
              <input
                class="field__control"
                id="commute-hours"
                name="commute-hours"
                type="number"
                inputmode="decimal"
                min="0"
                max="168"
                step="any"
                value="10"
              />
            </p>
          </fieldset>
        </form>

        <!-- Built once and updated in place by src/components/rate-view.ts. -->
        <div class="rate" id="life-rate" aria-live="polite"></div>
      </section>

      <section class="section section--wide" id="products" aria-labelledby="products-title">
        <h2 class="visually-hidden" id="products-title">Products, priced in time</h2>

        <!-- Built once and updated in place by src/components/ladder-view.ts. -->
        <div class="catalogue" id="ladder"></div>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
